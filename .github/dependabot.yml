# Weekly; minor + patch grouped into one PR per ecosystem. Majors come alone.
version: 2
updates:
  - package-ecosystem: npm # also pnpm (reads pnpm-lock.yaml)
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
