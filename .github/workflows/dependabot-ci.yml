# Dependabot PRs only: install, lint, typecheck, unit tests (no e2e, no
# Supabase), then auto-merge minor/patch. This stays well inside the 2,000
# free Actions minutes a month.
name: dependabot-ci
on: pull_request

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  automerge:
    needs: checks
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
